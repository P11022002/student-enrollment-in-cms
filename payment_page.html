        </nav>
    </header>
    <main>
        <section class="payment-form">
            <h1>Make a Payment</h1>
            <p>Please fill out the form below to complete your payment.</p>
            <form action="submit_payment.php" method="POST">
                <div class="form-group">
                    <label for="student-name">Student Name:</label>
                    <input type="text" id="student-name" name="student_name" placeholder="Enter your full name" required>
                </div>
                <div class="form-group">
                    <label for="student-id">Student ID:</label>
                    <input type="text" id="student-id" name="student_id" placeholder="Enter your student ID" required>
                </div>
                <div class="form-group">
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email address" required>
                </div>
                <div class="form-group">
                    <label for="amount">Amount (INR):</label>
                    <input type="number" id="amount" name="amount" placeholder="Enter the amount to pay" required>
                </div>
                <div class="form-group">
                    <label for="payment-method">Payment Method:</label>
                    <select id="payment-method" name="payment_method" required>
                        <option value="" disabled selected>Select a payment method</option>
                        <option value="credit_card">Credit Card</option>
                        <option value="debit_card">Debit Card</option>
                        <option value="net_banking">Net Banking</option>
                        <option value="upi">UPI</option>
                    </select>
                </div>
                <button type="submit" class="submit-btn"><a href="QR_page.html">Pay Now</a></button>
            </form>
        </section>
    </main>
